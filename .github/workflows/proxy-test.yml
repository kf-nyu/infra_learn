name: Reverse Proxy Test

on:
  push:
  workflow_dispatch:

jobs:
  proxy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run reverse proxy test
        working-directory: task2
        run: |
          chmod +x test_proxy.sh
          ./test_proxy.sh

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-test-log
          path: task2/proxy_test_*.log
